[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hvac-energy-optimizer"
version = "0.1.0"
description = "Physics-informed ML for HVAC energy optimization: forecasting, SAT reset, chiller sequencing, MPC"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Md. Sabbir Hossain" }]
keywords = ["hvac", "energy", "forecasting", "mpc", "building", "ashrae"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "jupyter", "notebook"]

[project.urls]
Homepage = "https://github.com/shuvo1901/Sabbir-Hossain"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
